{% extends "base.html" %}
{% load static %}

{% block title %}Check your inbox — Inkwell{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card" style="text-align:center">
        <div class="brand-lg" style="margin-inline:auto"><i class="fa-solid fa-envelope-circle-check"></i></div>
        <h1 class="display-font">Check your inbox</h1>
        <p class="sub">If an account exists for that email, we've sent a password reset link. It usually arrives within a minute.</p>
        <a href="{% url 'home' %}" class="btn btn-secondary btn-block">Back to home</a>
    </div>
</div>
{% endblock %}
