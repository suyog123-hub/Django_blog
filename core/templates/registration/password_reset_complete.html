{% extends "base.html" %}
{% load static %}

{% block title %}Password updated — Inkwell{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card" style="text-align:center">
        <div class="brand-lg" style="margin-inline:auto"><i class="fa-solid fa-circle-check"></i></div>
        <h1 class="display-font">All done!</h1>
        <p class="sub">Your password has been updated successfully. You can now sign in with your new password.</p>
        <a href="{% url 'login' %}" class="btn btn-primary btn-block btn-lg">Sign in</a>
    </div>
</div>
{% endblock %}
