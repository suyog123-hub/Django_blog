{% extends 'base.html' %}
{% load static %}

{% block title %}Profile - MyBlog{% endblock title %}

{% block content %}
<section class="profile-section">
    <div class="profile-card">
        <div class="profile-header">
            <div class="profile-avatar">
                <i class="fas fa-user-circle"></i>
            </div>
            <div class="profile-title">
                <h1>{{ user.username }}</h1>
                <p class="profile-email"><i class="fas fa-envelope"></i> {{ user.email }}</p>
                <p class="profile-joined"><i class="fas fa-calendar-alt"></i> Joined: {{ user.date_joined|date:"F j, Y" }}</p>
            </div>
        </div>

        <div class="profile-actions">
            <a href="{% url 'myBlogs' %}" class="btn btn-primary">
                <i class="fas fa-folder-open"></i> My Blogs
            </a>
            <a href="{% url 'addBlog' %}" class="btn btn-secondary">
                <i class="fas fa-pen-fancy"></i> Write New
            </a>
            <a href="{% url 'logout' %}" class="btn btn-danger">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </div>
</section>

{% endblock content %}
