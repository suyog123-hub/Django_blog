{% extends "base.html" %}

{% block title %}Write Blog{% endblock title %}

{% block content %}
<div class="form-card">
    <h1>Write a New Blog</h1>
    <p>Your blog will be visible on the homepage only after admin approval.</p>
    <form method="POST" action="{% url 'addBlog' %}" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>
        </div>
        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" rows="8" required></textarea>
        </div>
        <div class="form-group">
            <label for="image">Cover Image (optional)</label>
            <input type="file" id="image" name="image" accept="image/*">
        </div>
        <button type="submit" class="btn btn-primary">Submit for Approval</button>
    </form>
</div>
{% endblock content %}
