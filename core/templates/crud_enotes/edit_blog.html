{% extends "base.html" %}

{% block title %}Edit Blog{% endblock title %}

{% block content %}
<div class="form-card">
    <h1>Edit Blog</h1>
    <form method="POST" action="{% url 'editBlog' blog.id %}" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" value="{{ blog.title }}" required>
        </div>
        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" rows="8" required>{{ blog.content }}</textarea>
        </div>
        <div class="form-group">
            <label for="image">Cover Image</label>
            {% if blog.image %}
            <p class="form-help"><img src="{{ blog.image.url }}" alt="Current image" class="thumb"> Leave empty to keep the current image.</p>
            {% else %}
            <p class="form-help">No image uploaded yet.</p>
            {% endif %}
            <input type="file" id="image" name="image" accept="image/*">
        </div>
        <button type="submit" class="btn btn-primary">Update Blog</button>
    </form>
</div>
{% endblock content %}
